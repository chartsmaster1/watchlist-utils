name: Refresh market data monthly

# Monthly refresh of all datasets (S&P 500, NASDAQ, DOW, Russell 1000, ETFs,
# coins, ARKK, sectors), validation, commit of public/data back to main,
# and Firebase Hosting deploy. Replaces the macOS launchd schedule
# (scheduled_refresh.sh + deploy/launchd/), which failed with git exit 128
# on push and requires the Mac to be awake.
#
# Schedule: 1st of month, 05:30 America/Los_Angeles = 12:30 UTC
# (13:30 UTC during PDT summer months; cron is UTC-only so we use 12:30
# year-round and accept a 1h shift in summer).
# Manual run: Actions tab -> Refresh market data monthly -> Run workflow.

'on':
  schedule:
    - cron: '30 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh_data:
    runs-on: ubuntu-latest
    env:
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install refresh deps
        run: pip install -r requirements.txt

      - name: Refresh all datasets
        run: python3 public/src/main.py

      - name: Validate generated datasets
        run: python3 public/src/validate_data.py

      - name: Commit data changes
        run: |
          git config user.name 'data-bot'
          git config user.email 'data-bot@users.noreply.github.com'
          git add public/data
          git diff --cached --quiet && echo 'no data changes' && exit 0
          git commit -m 'Refresh market data'
          git push origin HEAD:main

      - name: Deploy to Firebase Hosting
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          channelId: live
